<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Cloner - Extract HTML, CSS & JavaScript</title>
    <link rel="stylesheet" href="https://cdn.tailwindcss.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === Fallback CSS (when CDN unavailable) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: #333;
        }
        
        /* Utility classes */
        .min-h-screen { min-height: 100vh; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-12 { margin-bottom: 3rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mr-3 { margin-right: 0.75rem; }
        .mr-2 { margin-right: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .gap-8 { gap: 2rem; }
        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .w-full { width: 100%; }
        .max-w-6xl { max-width: 72rem; margin-left: auto; margin-right: auto; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded { border-radius: 0.375rem; }
        .overflow-hidden { overflow: hidden; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .bg-gray-300 { background-color: #d1d5db; }
        .bg-white { background-color: #fff; }
        .bg-purple-600 { background-color: #9333ea; }
        .bg-purple-700 { background-color: #7e22ce; }
        .bg-pink-600 { background-color: #ec4899; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-blue-700 { background-color: #1d4ed8; }
        .bg-green-600 { background-color: #16a34a; }
        .bg-green-700 { background-color: #15803d; }
        .bg-amber-600 { background-color: #d97706; }
        .bg-amber-700 { background-color: #b45309; }
        .bg-red-100 { background-color: #fee2e2; }
        .bg-green-100 { background-color: #dcfce7; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-gray-600 { color: #4b5563; }
        .text-red-700 { color: #b91c1c; }
        .text-green-700 { color: #15803d; }
        .text-purple-100 { color: #f3e8ff; }
        .text-purple-600 { color: #9333ea; }
        .text-blue-600 { color: #2563eb; }
        .text-green-600 { color: #16a34a; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: 3rem; font-weight: bold; }
        .text-xl { font-size: 1.25rem; }
        .text-lg { font-size: 1.125rem; }
        .text-sm { font-size: 0.875rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-center { text-align: center; }
        .shadow { box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .shadow-p { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .border { border: 1px solid #d1d5db; }
        .border-2 { border: 2px solid #e5e7eb; }
        .border-b { border-bottom: 1px solid #e5e7eb; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .p-4 { padding: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .transition { transition: all 0.3s ease; }
        .hidden { display: none; }
        .block { display: block; }
        .grid { display: grid; }
        .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .md\:flex { display: flex; }
        .focus\:border-purple-600:focus { border-color: #9333ea; }
        .focus\:outline-none:focus { outline: none; }
        .hover\:bg-gray-50:hover { background-color: #f9fafb; }
        .hover\:bg-purple-700:hover { background-color: #7e22ce; }
        .hover\:bg-blue-700:hover { background-color: #1d4ed8; }
        .hover\:bg-green-700:hover { background-color: #15803d; }
        .hover\:bg-amber-700:hover { background-color: #b45309; }
        .hover\:shadow-lg:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .disabled\:opacity-50:disabled { opacity: 0.5; }
        .disabled\:cursor-not-allowed:disabled { cursor: not-allowed; }
        
        input[type="url"] {
            width: 100%;
            padding: 0.75rem 1.5rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        button {
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: inherit;
        }
        input:focus, button:focus {
            outline: none;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .gradient-to-r {
            background: linear-gradient(to right, #9333ea, #ec4899);
        }
        .tab-btn {
            cursor: pointer;
            border: none;
            background: transparent;
            font-weight: 600;
        }
        .tab-btn.active {
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }
        .code-block {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Monaco', 'Courier New', monospace;
            max-height: 600px;
            overflow-y: auto;
            border-radius: 8px;
            padding: 16px;
            font-size: 0.875rem;
        }
        .download-btn {
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .copy-btn {
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            transform: translateY(-2px);
        }
        
        /* Icon fallback */
        .fa::before { margin-right: 0.5rem; }
        .fas::before { margin-right: 0.5rem; }
        
        @media (max-width: 768px) {
            .md\:grid-cols-3 { grid-template-columns: 1fr; }
            .flex { flex-direction: column; }
            .gap-4 { gap: 1rem; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="gradient-bg min-h-screen py-12 px-4">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-5xl font-bold text-white mb-4">
                    <i class="fas fa-globe mr-3"></i>Website Cloner
                </h1>
                <p class="text-xl text-purple-100">
                    Extract any website into separate HTML, CSS & JavaScript files
                </p>
            </div>

            <!-- Input Section -->
            <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
                <form id="cloneForm" class="flex gap-4">
                    <div class="flex-1">
                        <input 
                            type="url" 
                            id="urlInput" 
                            placeholder="Enter website URL (e.g., https://example.com)"
                            class="w-full px-6 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition"
                            required
                        >
                    </div>
                    <button 
                        type="submit"
                        class="px-8 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-lg hover:shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
                        id="cloneBtn"
                    >
                        <i class="fas fa-clone mr-2"></i><span id="btnText">Clone Website</span>
                    </button>
                </form>

                <!-- Status Message -->
                <div id="statusMessage" class="mt-4 p-4 rounded-lg hidden" role="alert">
                    <span id="statusText"></span>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="grid md:grid-cols-3 gap-4 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-3xl text-purple-600 mb-2"><i class="fas fa-code"></i></div>
                    <h3 class="font-bold text-lg mb-2">Clean HTML</h3>
                    <p class="text-gray-600 text-sm">Extracted structure without scripts or styles</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-3xl text-blue-600 mb-2"><i class="fas fa-palette"></i></div>
                    <h3 class="font-bold text-lg mb-2">Full CSS</h3>
                    <p class="text-gray-600 text-sm">All styles combined into one stylesheet</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="text-3xl text-green-600 mb-2"><i class="fas fa-cog"></i></div>
                    <h3 class="font-bold text-lg mb-2">JavaScript</h3>
                    <p class="text-gray-600 text-sm">All scripts extracted into single file</p>
                </div>
            </div>

            <!-- Results Section (hidden initially) -->
            <div id="resultsContainer" class="hidden">
                <!-- Tabs -->
                <div class="bg-white rounded-lg shadow-lg mb-8 overflow-hidden">
                    <div class="flex border-b">
                        <button class="tab-btn active flex-1 py-4 px-6 font-semibold text-center hover:bg-gray-50 transition" data-tab="preview">
                            <i class="fas fa-eye mr-2"></i>Preview
                        </button>
                        <button class="tab-btn flex-1 py-4 px-6 font-semibold text-center hover:bg-gray-50 transition" data-tab="html">
                            <i class="fas fa-code mr-2"></i>HTML
                        </button>
                        <button class="tab-btn flex-1 py-4 px-6 font-semibold text-center hover:bg-gray-50 transition" data-tab="css">
                            <i class="fas fa-palette mr-2"></i>CSS
                        </button>
                        <button class="tab-btn flex-1 py-4 px-6 font-semibold text-center hover:bg-gray-50 transition" data-tab="js">
                            <i class="fas fa-cog mr-2"></i>JavaScript
                        </button>
                    </div>

                    <!-- Content Area -->
                    <div class="p-8">
                        <!-- Preview Tab -->
                        <div id="preview-tab" class="tab-content">
                            <div class="border-2 border-gray-300 rounded-lg overflow-hidden bg-white" style="height: 600px;">
                                <iframe id="previewFrame" style="width: 100%; height: 100%; border: none;"></iframe>
                            </div>
                        </div>

                        <!-- HTML Tab -->
                        <div id="html-tab" class="tab-content hidden">
                            <pre class="code-block"><code id="htmlCode"></code></pre>
                            <div class="mt-4 flex gap-4">
                                <button class="copy-btn px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" data-type="html">
                                    <i class="fas fa-copy mr-2"></i>Copy HTML
                                </button>
                                <button class="download-btn px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" data-type="html" data-filename="index.html">
                                    <i class="fas fa-download mr-2"></i>Download index.html
                                </button>
                            </div>
                        </div>

                        <!-- CSS Tab -->
                        <div id="css-tab" class="tab-content hidden">
                            <pre class="code-block"><code id="cssCode"></code></pre>
                            <div class="mt-4 flex gap-4">
                                <button class="copy-btn px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" data-type="css">
                                    <i class="fas fa-copy mr-2"></i>Copy CSS
                                </button>
                                <button class="download-btn px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition" data-type="css" data-filename="styles.css">
                                    <i class="fas fa-download mr-2"></i>Download styles.css
                                </button>
                            </div>
                        </div>

                        <!-- JavaScript Tab -->
                        <div id="js-tab" class="tab-content hidden">
                            <pre class="code-block"><code id="jsCode"></code></pre>
                            <div class="mt-4 flex gap-4">
                                <button class="copy-btn px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" data-type="js">
                                    <i class="fas fa-copy mr-2"></i>Copy JS
                                </button>
                                <button class="download-btn px-6 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition" data-type="js" data-filename="script.js">
                                    <i class="fas fa-download mr-2"></i>Download script.js
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
